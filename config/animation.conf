# MangoWM Animation Configuration

animations=1
layer_animations=1

# Window and layer animation styles
# windowsIn uses popin 80% in Mine.lua -> zoom with 0.8 initial ratio
animation_type_open=zoom
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide

# Fade settings
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.0
fade_out_begin_opacity=0.8

# Popin / Zoom ratios (Mine.lua: style = "popin 80%")
zoom_initial_ratio=0.8
zoom_end_ratio=0.8

# Tag / Workspace transition direction
tag_animation_direction=1

# Animation Durations (ms) mapped from Hyprland speeds:
# speed 3.2 -> ~220ms (open)
# speed 2.8 -> ~250ms (close)
# speed 3.0 -> ~230ms (move)
# speed 4.0 -> ~180ms (tag / workspaces)
# speed 1.6 / focus -> ~150ms
animation_duration_open=220
animation_duration_close=200
animation_duration_move=230
animation_duration_tag=180
animation_duration_focus=150

# Animation Bezier Curves from Mine.lua:
# winIn: (0.07, 0.88), (0.04, 0.99)
animation_curve_open=0.07,0.88,0.04,0.99

# easeOutCirc: (0, 0.48), (0.38, 1) -> windowsOut
animation_curve_close=0.0,0.48,0.38,1.0

# wind: (0.05, 0.85), (0.03, 0.97) -> windowsMove
animation_curve_move=0.05,0.85,0.03,0.97

# menu_decel: (0.05, 0.82), (0, 1) -> workspaces / fadeLayersIn
animation_curve_tag=0.05,0.82,0.0,1.0

# liner: (1, 1), (1, 1) -> border / focus
animation_curve_focus=1.0,1.0,1.0,1.0

# Opacity Fade Curves:
# fadeLayersIn / menu_decel: (0.05, 0.82, 0.0, 1.0)
animation_curve_opacity_fade_in=0.05,0.82,0.0,1.0

# fadeLayersOut / menu_accel: (0.20, 0.0), (0.82, 0.10)
animation_curve_opacity_fade_out=0.20,0.0,0.82,0.10
