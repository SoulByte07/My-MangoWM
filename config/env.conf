# Environment variables for MangoWM
# Location: ~/.config/mango/env.conf

# TODO: change to your CPU
# Hardware video acceleration (Intel Alder Lake-H Iris Xe)
env=LIBVA_DRIVER_NAME,iHD
env=VDPAU_DRIVER,va_gl
env=MESA_LOADER_DRIVER_OVERRIDE,iris

# Toolkit and Wayland platform backends
env=GDK_BACKEND,wayland,*
env=QT_QPA_PLATFORM,wayland
env=CLUTTER_BACKEND,wayland
env=SDL_VIDEODRIVER,wayland
env=MOZ_ENABLE_WAYLAND,1

# Desktop identification
env=XDG_CURRENT_DESKTOP,wlroots:mango
env=XDG_SESSION_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

# Ozone / Chromium / Electron Wayland support
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=CHROME_OZONE_PLATFORM_HINT,wayland
env=OZONE_PLATFORM,wayland

# Qt theming & scaling
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_STYLE_OVERRIDE,Fusion
env=QT_QUICK_CONTROLS_STYLE,Basic
env=GDK_SCALE,1
env=QT_SCALE_FACTOR,1

# Cursor theme
env=XCURSOR_THEME,Bibata-Modern-Ice
env=XCURSOR_SIZE,24
