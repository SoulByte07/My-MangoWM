# MangoWM Configuration - Replicated from Hyprland
# Location: ~/.config/mango/config.conf

# Window Effect & Performance
blur=0
blur_layer=0
blur_optimized=1
shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=12
shadows_blur=16
shadows_position_x=0
shadows_position_y=3
shadows_color=0x00000077
border_radius=10
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0
dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000020

# Animation Configuration (swappable via Animations.sh)
source=~/.config/mango/config/animation.conf

# Master-Stack Layout Setting (replicating Hyprland master layout)
new_is_master=1
smart_gaps=1
default_master_factor=0.55
default_master_count=1
tag_num=9

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.9
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.9,1.0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
overview_gap_inner=2
overview_gap_outer=10

# Misc Compositor Options
sync_obj_enable=1
auto_reload_config=1
tag_carousel=1
enable_border_resize=1
border_resize_size=8
drag_corner=1
allow_lock_transparent=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
circle_layout=tile,scroller
enable_floating_snap=1
snap_distance=30
cursor_size=24
cursor_theme=Bibata-Modern-Ice
cursor_hide_timeout=3
cursor_hide_on_keypress=1
idle_inhibit_when_fullscreen=1
drag_tile_to_tile=1
single_scratchpad=1

# Keyboard
repeat_rate=50
repeat_delay=300
numlock_on=1
xkb_rules_layout=us

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=0
disable_middle_paste=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
mouse_accel_profile=2
mouse_accel_speed=0.0

# Appearance & Wallust Colors
gap_inner_horizontal=2
gap_inner_vertical=2
gap_outer_horizontal=4
gap_outer_vertical=4
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.85
border_px=2

# Sub-configurations
source=~/.config/mango/config/colors.conf
source=~/.config/mango/config/env.conf
source=~/.config/mango/config/monitor.conf
source=~/.config/mango/config/tag.conf
source=~/.config/mango/config/rule.conf
source=~/.config/mango/config/bind.conf

# Autostart
exec_once=~/.config/mango/config/autostart.sh
