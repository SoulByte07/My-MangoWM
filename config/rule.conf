# Window and Layer Rules for MangoWM
# Location: ~/.config/mango/rule.conf

# Popups & Tool Windows
window_rule=is_floating:1,is_named_scratchpad:1,app_id:foot-dropterm,width:1400,height:850
window_rule=is_floating:1,app_id:floating_center_1by5,width:1100,height:650
window_rule=is_floating:1,app_id:.*satty.*,width:1425,height:800
window_rule=is_floating:1,app_id:pavucontrol,width:720,height:520
window_rule=is_floating:1,app_id:org.pulseaudio.pavucontrol,width:720,height:520
window_rule=is_floating:1,app_id:blueman-manager,width:800,height:600
window_rule=is_floating:1,app_id:nm-connection-editor
window_rule=is_floating:1,app_id:xfce-polkit
window_rule=is_floating:1,app_id:xdg-desktop-portal-gtk,width:1100,height:650

# Games
window_rule=is_fullscreen:1,app_id:steam

# File Choosers & Dialogs
# window_rule=is_floating:1,title:打开文件
# window_rule=is_floating:1,title:选择文件
window_rule=is_floating:1,title:Open File
window_rule=is_floating:1,title:Save File
window_rule=is_floating:1,title:Save As
window_rule=is_floating:1,title:.*Preferences.*
window_rule=is_floating:1,title:.*Settings.*

# Picture-in-Picture (Sticky across all workspaces)
window_rule=is_floating:1,is_global:1,title:^[Pp]icture-in-[Pp]icture$
window_rule=is_floating:1,is_global:1,title:^Picture in picture$

# Layer Rules (Rofi & Mangobar)
layer_rule=animation_type_open:slide,layer_name:rofi
layer_rule=animation_type_close:slide,layer_name:rofi
layer_rule=animation_type_open:slide,layer_name:mangobar
layer_rule=animation_type_close:slide,layer_name:mangobar
