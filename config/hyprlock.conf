# /* ---- 💫 MangoWM Hyprlock Configuration 💫 ---- */
# Standalone hyprlock configuration for MangoWM

# Sourcing colors generated by wallust in MangoWM
source = $HOME/.config/mango/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/mango/scripts

general {
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    # Use MangoWM's active wallpaper
    path = $HOME/.config/mango/wallpaper_effects/.wallpaper_current
    
    color = rgb(0,0,0) # color rendered initially until path is loaded

    # Blur configuration
    blur_size = 5
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Hour-Time
label {
    monitor =
    text = cmd[update:10000] echo "$(date +"%I:%M %p")" # AM/PM
    color = $color8
    font_size = 130
    font_family = JetBrainsMono Nerd Font ExtraBold 
    position = 0, -250
    halign = center
    valign = top
}

# USER
label {
    monitor =
    text =   $USER
    color = $color9
    font_size = 36
    font_family = Victor Mono Bold Oblique
    position = 0, 275
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 230, 70
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $color8
    inner_color = rgba(255, 255, 255, 0.1)
    capslock_color = rgb(255,255,255)
    font_color = $color13
    fade_on_empty = false
    font_family = Victor Mono Bold Oblique
    placeholder_text = <i><span foreground="##ffffff99">🔒 Type Password</span></i>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

# Keyboard LAYOUT
label {
    monitor =
    text = $LAYOUT
    color = $color8
    font_size = 14
    font_family = Victor Mono Bold Oblique
    position = 0, 70
    halign = center
    valign = bottom
}

# Uptime
label {
    monitor =
    text = cmd[update:60000] echo "<b> "$(uptime -p || $Scripts/UptimeNixOS.sh)" </b>"
    color = $color8
    font_size = 24
    font_family = Victor Mono Bold Oblique
    position = -20, 10
    halign = right
    valign = bottom
}

# Battery Information
label {
    monitor =
    text = cmd[update:60000] echo "<b> "$($Scripts/Battery.sh)" </b>"
    color = $color8
    font_size = 16
    font_family = Victor Mono Bold Oblique
    position = -20, 40
    halign = right
    valign = bottom
}
