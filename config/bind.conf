# Keybindings for MangoWM - Replicated from Hyprland
# Location: ~/.config/mango/bind.conf

# Reload Configuration
bind=SUPER,r,reload_config
bind=SUPER+SHIFT,r,spawn,bash ~/.config/mango/scripts/reload.sh

# Session & Power Management
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,q,spawn,bash ~/.config/mango/scripts/KillActiveProcess.sh
# bind=SUPER+CTRL,Delete,spawn,bash ~/.config/mango/scripts/Logout.sh
bind=SUPER+CTRL,l,spawn,bash ~/.config/mango/scripts/LockScreen.sh
# bind=SUPER+ALT,l,spawn_shell,loginctl lock-session && sleep 2 && systemctl suspend
bind=SUPER+CTRL,p,spawn,bash ~/.config/mango/scripts/Wlogout.sh

# Terminal and Applications
bind=SUPER,Return,spawn,foot
bind=SUPER+SHIFT,Return,toggle_named_scratchpad,foot-dropterm,none,foot --app-id=foot-dropterm
bind=SUPER,d,spawn,bash ~/.config/mango/scripts/RofiLauncher.sh
bind=SUPER+SHIFT,d,spawn,fuzzel
bind=SUPER,e,spawn,pcmanfm
bind=SUPER,b,spawn,xdg-open https://
bind=SUPER,tab,toggleoverview

# User Scripts & Menus
bind=SUPER,s,spawn,bash ~/.config/mango/scripts/tools-manager.sh
# bind=SUPER+SHIFT,c,spawn_shell,foot --app-id=floating_center_1by5 bash -c ~/.config/mango/scripts/snippets-insert.sh
bind=SUPER,p,spawn,bash ~/.config/mango/scripts/screenshot-menu.sh
# bind=SUPER+SHIFT,m,spawn,bash ~/.config/mango/scripts/bookmarks-menu.sh
bind=SUPER,m,spawn,bash ~/.config/mango/scripts/SystemMonitor.sh
bind=SUPER,c,spawn,bash ~/.config/mango/scripts/RofiCalc.sh
bind=SUPER+CTRL,e,spawn,bash ~/.config/mango/scripts/RofiEmoji.sh
bind=SUPER,v,spawn,bash ~/.config/mango/scripts/ClipManager.sh
bind=SUPER,w,spawn,bash ~/.config/mango/scripts/WallpaperSelect.sh
# bind=SUPER+CTRL,h,spawn,bash ~/.config/mango/scripts/KeyHints.sh
# bind=SUPER+SHIFT,k,spawn,bash ~/.config/mango/scripts/KeyBinds.sh
# bind=SUPER+SHIFT,a,spawn,bash ~/.config/mango/scripts/Animations.sh
bind=SUPER+CTRL,r,spawn,bash ~/.config/mango/scripts/Refresh.sh
# bind=SUPER+SHIFT,t,spawn,bash ~/.config/mango/scripts/ThemeChanger.sh
bind=SUPER+SHIFT,g,spawn,bash ~/.config/mango/scripts/GameMode.sh
bind=SUPER+CTRL,b,spawn,bash ~/.config/mango/scripts/hide_mangobar.sh
bind=SUPER+ALT,b,spawn,bash ~/.config/mango/scripts/MangobarStyles.sh

# Audio & Media Controls
bind=none,XF86AudioRaiseVolume,spawn,bash ~/.config/mango/scripts/Volume.sh --inc
bind=none,XF86AudioLowerVolume,spawn,bash ~/.config/mango/scripts/Volume.sh --dec
bind=ALT,XF86AudioRaiseVolume,spawn,bash ~/.config/mango/scripts/Volume.sh --inc-precise
bind=ALT,XF86AudioLowerVolume,spawn,bash ~/.config/mango/scripts/Volume.sh --dec-precise
bind=none,XF86AudioMute,spawn,bash ~/.config/mango/scripts/Volume.sh --toggle
bind=none,XF86AudioMicMute,spawn,bash ~/.config/mango/scripts/Volume.sh --toggle-mic
bind=none,XF86AudioPlay,spawn,bash ~/.config/mango/scripts/MediaCtrl.sh --pause
bind=none,XF86AudioNext,spawn,bash ~/.config/mango/scripts/MediaCtrl.sh --nxt
bind=none,XF86AudioPrev,spawn,bash ~/.config/mango/scripts/MediaCtrl.sh --prv
bind=none,XF86AudioStop,spawn,bash ~/.config/mango/scripts/MediaCtrl.sh --stop
bind=none,xf86Sleep,spawn,systemctl suspend

# Display & Keyboard Brightness
bind=none,XF86MonBrightnessDown,spawn,bash ~/.config/mango/scripts/Brightness.sh --dec
bind=none,XF86MonBrightnessUp,spawn,bash ~/.config/mango/scripts/Brightness.sh --inc
bind=none,XF86KbdBrightnessDown,spawn,bash ~/.config/mango/scripts/BrightnessKbd.sh --dec
bind=none,XF86KbdBrightnessUp,spawn,bash ~/.config/mango/scripts/BrightnessKbd.sh --inc
bind=none,XF86KbdLightOnOff,spawn,bash ~/.config/mango/scripts/BrightnessKbd.sh --cycle

# Window Focus (Vim Keys & Arrows)
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
# bind=SUPER,Left,focusdir,left
# bind=SUPER,Down,focusdir,down
# bind=SUPER,Up,focusdir,up
# bind=SUPER,Right,focusdir,right

# Window Directional Movement
bind=SUPER+ALT,h,move_client,left
bind=SUPER+ALT,j,move_client,down
bind=SUPER+ALT,k,move_client,up
bind=SUPER+ALT,l,move_client,right

# Swap Windows
# bind=SUPER+ALT,Left,exchange_client,left
# bind=SUPER+ALT,Down,exchange_client,down
# bind=SUPER+ALT,Up,exchange_client,up
# bind=SUPER+ALT,Right,exchange_client,right

# Window Resizing
bind=SUPER+SHIFT,h,resizewin,-50,+0
bind=SUPER+SHIFT,l,resizewin,+50,+0
bind=SUPER+SHIFT,k,resizewin,+0,-50
bind=SUPER+SHIFT,j,resizewin,+0,+50

# Layout & Window States
bind=SUPER,space,switch_layout
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,

# Master Layout Controls
bind=SUPER,i,incnmaster,1
bind=SUPER+SHIFT,i,incnmaster,-1
bind=SUPER+CTRL,Return,zoom,

# Special Workspace (Scratchpad)
bind=SUPER,u,toggle_named_scratchpad,foot-dropterm,none,foot --app-id=foot-dropterm
bind=SUPER+SHIFT,u,tag_special_tag,

# Tag / Workspace Navigation (Tags 1 - 9)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move Window to Tag
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Move Window Silently to Tag
bind=SUPER+CTRL,1,tagsilent,1
bind=SUPER+CTRL,2,tagsilent,2
bind=SUPER+CTRL,3,tagsilent,3
bind=SUPER+CTRL,4,tagsilent,4
bind=SUPER+CTRL,5,tagsilent,5
bind=SUPER+CTRL,6,tagsilent,6
bind=SUPER+CTRL,7,tagsilent,7
bind=SUPER+CTRL,8,tagsilent,8
bind=SUPER+CTRL,9,tagsilent,9

# Relative Tag Navigation
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=SUPER+SHIFT,bracketleft,tagtoleft,0
bind=SUPER+SHIFT,bracketright,tagtoright,0

# Mouse Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,togglemaximizescreen,0

# Axis Bindings (Scroll wheel tag navigation)
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Touchpad Gesture Bindings (Hyprland / macOS parity)
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewtoleft_have_client
gesturebind=none,left,4,viewtoright_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

